[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squirrel-shooter"
version = "0.3.0"
description = "Raspberry Pi garden camera, review, and safety-gated manual control workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "numpy>=1.24,<3",
    "opencv-python>=4.8,<5",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
detector = ["ncnn==1.0.20260526"]
servo = [
    "adafruit-circuitpython-servokit",
    "adafruit-circuitpython-pca9685",
    "adafruit-lgpio>=0.2.2.0; sys_platform == 'linux' and python_version >= '3.13' and (platform_machine == 'aarch64' or platform_machine == 'armv7l')",
    "gpiozero>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
squirrel_shooter = ["templates/*.html", "static/*.css", "static/*.js", "static/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

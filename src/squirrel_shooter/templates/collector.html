<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squirrel collector diagnostics</title>
<style>body{font:16px system-ui;margin:2rem auto;padding:0 1rem;max-width:1000px;background:#14201b;color:#eef6ef}button{padding:.8rem;margin:.3rem;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#23342a;padding:1rem}h1{font-size:1.7rem}#message{min-height:1.5rem}</style></head>
<body><h1>Squirrel collector diagnostics</h1>
<p>Collector mode · Physical controls unavailable · Detection floor is diagnostic</p>
<button id="record">Record 30 seconds</button><button id="stop">Stop recording</button>
<p id="message" role="status"></p><pre id="status" aria-label="Collector status">Loading…</pre>
<script>
const token = {{ recording_token|tojson }};
async function refresh() {
  try {
    const r = await fetch('/api/status');
    if (!r.ok) throw new Error('Status unavailable');
    document.getElementById('status').textContent = JSON.stringify(await r.json(), null, 2);
  } catch (e) { document.getElementById('message').textContent = e.message; }
}
async function record(action) {
  try {
    const r = await fetch('/api/recording/' + action, {method:'POST', headers:{'X-Recording-Token':token}});
    const result = await r.json();
    if (!r.ok) throw new Error(result.error || 'Recording unavailable');
    document.getElementById('message').textContent = action === 'start' ? 'Recording requested' : 'Manual recording stopped';
    await refresh();
  } catch (e) { document.getElementById('message').textContent = e.message; }
}
document.getElementById('record').onclick = () => record('start');
document.getElementById('stop').onclick = () => record('stop');
refresh(); setInterval(refresh, 1000);
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Re-enter calibration</title></head>
<body><h1>Re-enter calibration</h1><p>Use this setup tool if the camera or nozzle has moved. Entering setup inhibits automatic firing for this process. Completing calibration does not re-enable it.</p>
<button id="enter">Enter calibration</button><p id="message" role="status"></p><a href="/">Return to collector</a>
<script>const token={{control_token|tojson}};document.getElementById('enter').onclick=async()=>{const b=document.getElementById('enter');b.disabled=true;try{const r=await fetch('/api/control/action',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Token':token},body:JSON.stringify({action:'enter_calibration'})});const s=await r.json();if(!r.ok)throw Error(s.error||'Setup unavailable');location.assign('/calibration');}catch(e){document.getElementById('message').textContent=e.message;b.disabled=false;}};</script></body></html>

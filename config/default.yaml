# Collector-only detector. The diagnostic floor is not a firing threshold.
detector:
  enabled: false
  backend: ncnn
  manifest_path: ""
  manifest_sha256: ""
  target_hz: 2.0
  maximum_source_age_seconds: 0.75
  maximum_result_age_seconds: 1.5
  diagnostic_confidence_floor: 0.01
  num_threads: 2
  shutdown_timeout_seconds: 2.0

# Conservative starting values for a fixed 1280x720 garden camera. Fifteen FPS
# gives the 12 FPS evidence sampler headroom without asking the Pi to capture
# twice as many frames as any consumer uses.
camera:
  device_index: 0
  requested_width: 1280
  requested_height: 720
  requested_fps: 15
  output_directory: captures
  camera_mode_if_known: unknown
  ir_mode_if_explicitly_detected_or_configured: unknown
  low_fps_threshold: 10.0
  reopen_after_failed_reads: 10
  reopen_delay_seconds: 2.0

# One process owns the camera and publishes frames to every consumer.
shared_camera:
  reconnect_enabled: true
  maximum_consecutive_read_failures: 10
  reconnect_delay_seconds: 2.0
  consumer_wait_timeout_seconds: 1.0
  annotated_frame_stale_seconds: 3.0

runtime:
  headless: false
  shutdown_timeout_seconds: 10.0
  # Avoid OpenCV turning each image operation into several continuously busy
  # native workers on the four-core Pi. Event-driven inference remains enabled.
  opencv_threads: 1
  # Aggregate runtime metrics and refresh the crash-aware session summary at a
  # low-write cadence. No per-frame telemetry is logged.
  telemetry_interval_seconds: 30.0

dashboard:
  enabled: true
  host: 0.0.0.0
  port: 5000
  stream_fps: 8.0
  jpeg_quality: 82
  status_refresh_interval_seconds: 3.0

# Pause evidence recording and classifier CPU work while the camera is producing
# sustained monochrome night-vision frames. The live feed remains available.
night_mode:
  pause_recording_and_classifier: true
  monochrome_colorfulness_threshold: 8.0
  enter_consecutive_frames: 5
  exit_consecutive_frames: 10

# LEGACY MobileNet/VOC: one asynchronous classification per qualified event.
# These taxonomy/review options are not a future one-class squirrel contract.
# It uses the best frame
# after completion by default, or the qualified live frame when auto-fire is
# explicitly enabled. The pinned MobileNet-SSD model is unchanged.
classifier:
  enabled: true
  model_definition: models/mobilenet-ssd/deploy.prototxt
  model_weights: models/mobilenet-ssd/mobilenet_iter_73000.caffemodel
  frame_selection: best
  fallback_event_frame_number: 1
  crop_margin_percent: 30.0
  detection_confidence: 0.25
  auto_accept_confidence: 0.60
  auto_accept_labels:
    - person
    - car
  evidence_directory: captures/classifier  # read-only legacy source for migration
  audit_log_filename: classifier.jsonl
  worker_queue_capacity: 1
  # DNN decisions are delivered before evidence persistence. Both downstream
  # stages are bounded so neither the classifier nor motion producer can wait
  # indefinitely on control or storage work.
  decision_queue_capacity: 2
  evidence_queue_capacity: 8

# LEGACY MobileNet autonomous policy is explicitly armed here as before.
# Its current person checks remain operational until the one-class migration;
# a separate person detector/veto is not an owner requirement for that future.
# It reuses one already-qualified motion event, the existing
# classifier worker, calibrated pixel interpolation, and the shared physical
# coordinator. Only actual MobileNet-SSD VOC labels may be allowlisted.
auto_fire:
  enabled: true
  min_confidence: 0.70
  allowed_classes:
    - dog
    - cat
    - bird
  cooldown_seconds: 5.0
  max_shots_per_event: 1
  minimum_reengagement_seconds: 60.0
  max_shots_per_hour: 6
  # A queued classification must complete promptly, and the same qualified
  # track must still have a current detector observation before valve opening.
  classification_max_age_seconds: 3.0
  target_max_age_seconds: 0.75
  # After each settle, run the one shared DNN on a strictly newer native frame.
  # Legacy-only person semantics: anything but a current, identity-matched
  # clear result is a hard no-fire. Never synthesize this from squirrel output.
  scene_safety_max_age_seconds: 0.75
  scene_safety_timeout_seconds: 1.5
  # Small target motion may authorize directly. Larger but still compatible
  # motion gets one re-aim; movement beyond these bounds is rejected.
  final_aim_direct_drift_pixels: 24
  final_aim_reaim_max_drift_pixels: 100
  final_aim_minimum_iou: 0.10
  final_aim_max_area_ratio: 4.0
  final_aim_max_elapsed_seconds: 0.75
  # Brief detector dropouts retain identity but never expose a stale aim point.
  # A held qualifying result may resume only after a unique compatible live
  # observation restores this same event/track association.
  track_loss_grace_seconds: 0.9
  reacquisition_max_centroid_distance_pixels: 100
  reacquisition_max_area_ratio: 2.5
  # The retained shot ledger and rolling one-hour limit survive service restarts.
  # Corrupt/unreadable state or suspicious rate-limit clock evidence fails closed.
  rate_limit_state_file: captures/auto-fire-rate-limit.json

# Bench-verified pan/tilt calibration. Starting the controller configures the
# PCA9685 channels but never commands movement until a manual request arrives.
pan_tilt:
  i2c_address: 0x40
  pan_channel: 0
  tilt_channel: 1
  pan_pulse_min_us: 600
  pan_pulse_max_us: 2400
  tilt_pulse_min_us: 600
  tilt_pulse_max_us: 2400
  pan_min: 30
  pan_center: 85
  pan_max: 150
  tilt_min: 70
  tilt_center: 85
  tilt_max: 150
  # PARK is separate from CENTER. Rest at tilt 82 to reduce nozzle dripping.
  park_pan: 85
  park_tilt: 82
  movement_speed: 45.0
  fast_acquisition_speed: 120.0
  step_interval_seconds: 0.02
  settling_delay_seconds: 0.15
  release_pwm_after_movement: false
  park_on_cleanup: true

# Configured pulse for supervised manual calibration and testing.
manual_control:
  servo_enabled: true
  default_step_degrees: 3
  allowed_step_degrees: [1, 3, 5]
  fire_pulse_seconds: 0.40
  fire_cooldown_seconds: 10.0
  calibration_file: config/calibration_points.json
  recording:
    enabled: true
    # Seven seconds of real elapsed time: about 2s before and 5s after FIRE.
    # If pre-roll is unavailable, the recorder extends post-roll to about 7s.
    pre_roll_seconds: 2.0
    post_roll_seconds: 5.0
    # Sample raw pre-roll frames; JPEG work begins only for saved output/viewers.
    target_fps: 12.0
    zoom_factor: 2.0
    # Target-click shots use their verified camera pixel. D-pad/manual-angle
    # shots use this fixed 1280x720 garden fallback until an inverse mapping exists.
    crop_center_x: 640
    crop_center_y: 360
    save_full_frame_clip: true
    clip_codec: MJPG

# Physically traced MOSFET signal: Raspberry Pi physical pin 18 is BCM GPIO24;
# physical pin 20 is GND. Enabled for supervised manual operation.
valve:
  enabled: true
  gpio_pin: 24
  active_high: true

# Phase 2 clean recording. No detector or FIRE callback is connected to it yet.
# Segment duration follows the existing 60s event cap. The 10-minute logical
# session cap and 1GiB admission budget are conservative policy defaults, not
# measured Pi limits. All evidence is retained when the budget blocks recording.
recording:
  enabled: true
  pre_roll_seconds: 2.0
  manual_duration_seconds: 30.0
  automatic_tail_seconds: 3.0
  maximum_segment_seconds: 60.0
  maximum_session_seconds: 600.0
  observation_max_age_seconds: 3.0
  target_fps: 12.0
  codec: MJPG
  queue_capacity: 8
  shutdown_timeout_seconds: 2.0
  minimum_free_megabytes: 256.0
  storage_budget_megabytes: 1024.0
  maximum_buffer_megabytes: 128.0

motion:
  enabled: true
  processing_width: 640
  # Motion timing remains elapsed-time based while expensive vision work samples
  # the shared camera at a rate suitable for garden monitoring.
  target_fps: 10.0
  history: 500
  variance_threshold: 32
  detect_shadows: true
  blur_kernel: 7
  morphology_kernel: 5
  open_iterations: 1
  close_iterations: 2
  min_blob_area: 500
  max_blob_area: 150000
  recent_event_limit: 100

  startup_warmup:
    seconds: 12.0
    minimum_frames: 60

  # Dad's garden inclusion zone, normalized from the 1686x879 reference image.
  # It keeps the gate/ground approach and lower-right yard while excluding the
  # distant tree line and most of the planted garden at far left.
  inclusion_zone:
    enabled: true
    polygon:
      - [0.0, 0.569476]
      - [0.103858, 0.552392]
      - [0.183976, 0.461276]
      - [0.282493, 0.287016]
      - [0.292582, 0.212984]
      - [1.0, 0.218679]
      - [1.0, 1.0]
      - [0.0, 1.0]

  persistence:
    frames: 5
    max_centroid_distance_pixels: 100
    # Must span the bounded auto-fire reacquisition grace above.
    maximum_gap_seconds: 0.9
    cooldown_seconds: 8.0

  # Keep weak motion visible for tuning, but do not turn it into a saved event.
  candidate_filter:
    enabled: true
    minimum_frame_percent: 0.15
    ignore_tiny_motion: true
    ignore_plant_or_shadow_flicker: true
    # Reject local motion that changes brightness while preserving the learned
    # grass/background color. Set this switch to false for immediate rollback.
    ignore_localized_lighting_changes: true
    localized_lighting_minimum_luminance_delta: 8.0
    localized_lighting_minimum_background_luminance: 8.0
    localized_lighting_maximum_chromaticity_delta: 0.10
    localized_lighting_minimum_fraction: 0.85
    require_coherent_small_motion: true
    small_motion_minimum_travel_pixels: 10.0

  grouping:
    enabled: true
    max_horizontal_gap_pixels: 80
    max_vertical_gap_pixels: 80
    expanded_box_margin_pixels: 40
    max_centroid_distance_pixels: 140
    direction_similarity_degrees: 50
    speed_similarity_ratio: 2.5
    maximum_components_per_group: 12

  global_rejection:
    enabled: true
    max_frame_motion_percent: 35.0
    max_zone_motion_percent: 45.0
    recovery_seconds: 3.0
    log_rejected_global_events: true
    save_debug_snapshot: false
    exposure_luminance_delta: 35.0
    ir_colorfulness_delta: 18.0
    obstruction_motion_percent: 80.0

  event_lifecycle:
    pre_event_seconds: 2.0
    post_event_seconds: 3.0
    maximum_event_seconds: 60.0
    clip_codec: MJPG

  provisional_classification:
    tiny_max_frame_percent: 0.08
    small_animal_max_frame_percent: 1.5
    medium_animal_max_frame_percent: 5.0
    person_min_height_percent: 35.0
    large_object_min_frame_percent: 5.0
    flicker_min_components: 5
    stationary_speed_pixels_per_second: 8.0
    slow_speed_pixels_per_second: 30.0
    fast_speed_pixels_per_second: 150.0

  # Backward-compatible settings used by the read-only dashboard detector.
  learning_frames: 90
  persistence_frames: 3
  persistence_max_distance: 80
  cooldown_seconds: 8
  lighting_change_percent: 65
  roi:
    enabled: false
    x: 0.0
    y: 0.0
    width: 1.0
    height: 1.0
  debug_outputs:
    directory: debug
    min_interval_seconds: 5
    foreground_mask: false
    cleaned_mask: false
    annotated_frame: false
    roi_visualization: false
    rejected_candidate_frame: false

reporting:
  directory: captures/reports
  thumbnail_width: 320
  rebuild_on_clean_shutdown: true

retention:
  maximum_storage_megabytes: 4096
  maximum_event_age_days: 30
  maximum_event_count: 1000

health:
  camera_stale_seconds: 3
  detector_stale_seconds: 5

# Legacy dashboard limits remain separate from complete watcher event retention.
storage:
  max_event_captures: 500
  max_debug_images: 200
  max_log_files: 14

logging:
  level: INFO
  directory: captures/logs
  event_csv: events.csv
  event_jsonl: events.jsonl
  rejection_jsonl: rejections.jsonl
  sessions_directory: sessions
  maximum_active_log_megabytes: 100
  retained_log_rotations: 5

# Used exclusively by the control-incapable collector entry point.
collector_preview:
  enabled: true
  maximum_fps: 2.0
  jpeg_quality: 65

automatic_recording:
  enabled: false
  squirrel_confidence: 0.02 # RECORDING ONLY; not an engagement threshold.
  tail_seconds: 10.0
